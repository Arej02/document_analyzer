[project]
name = "document-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arej02", email = "khadkaarya20@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "leidenalg>=0.12.0",
    "networkx>=3.6.1",
    "openai>=1.0.0",
    "pyjwt[crypto]>=2.14.0",
    "pypdf>=5.1.0",
    "python-dotenv>=1.0.1",
    "python-igraph>=1.0.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
document-analyzer = "document_analyzer:main"
document-analyzer-worker = "document_analyzer.worker.run:main"
document-analyzer-planner = "document_analyzer.agent2.worker.run:main"
document-analyzer-executor = "document_analyzer.agent3.worker.run:main"
document-analyzer-reporter = "document_analyzer.report.worker.run:main"
document-analyzer-add-org-member = "document_analyzer.admin.add_org_member:main"
document-analyzer-build-graphify-image = "document_analyzer.worker.graphify.image:main"
document-analyzer-build-agent3-image = "document_analyzer.agent3.worker.image:main"
document-analyzer-build-report-image = "document_analyzer.report.image:main"
document-analyzer-doctor = "document_analyzer.doctor:main"
document-analyzer-setup-db = "document_analyzer.setup_db:main"

[tool.uv.build-backend]
module-root = "backend"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy==2.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live_container: runs real containers on the configured engine (skips when it isn't running)"]
