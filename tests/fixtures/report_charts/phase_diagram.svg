<svg class="chart" role="img" width="348" height="132" viewBox="0 0 348 132" preserveAspectRatio="xMidYMid meet"><title>Phase order</title><desc>2 phase(s); phase 2 depends on phase 1</desc><defs><marker id="ph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16181d"/></marker></defs><path d="M148 55Q174 63 200 55" fill="none" stroke="#16181d" stroke-width="1.3" marker-end="url(#ph-arrow)"><title>Phase 1 comes before phase 2</title></path><rect x="16" y="16" width="132" height="78" rx="6" fill="#f4f5f8" stroke="#16181d" stroke-width="2.5"><title>Phase 1: Foundation</title></rect><text x="26" y="36" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" fill="#16181d">Phase 1</text><text x="26" y="54" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#16181d">Foundation</text><text x="26" y="71" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#5d6573">2 units</text><text x="26" y="85" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#16181d">High risk</text><rect x="200" y="16" width="132" height="78" rx="6" fill="#f4f5f8" stroke="#16181d" stroke-width="1.5" stroke-dasharray="5 3"><title>Phase 2: Shop</title></rect><text x="210" y="36" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" fill="#16181d">Phase 2</text><text x="210" y="54" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#16181d">Shop</text><text x="210" y="71" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#5d6573">2 units</text><text x="210" y="85" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#5d6573">Medium risk</text><text x="16" y="124" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#5d6573">An arrow from one phase to another means the second needs the first finished before it starts.</text></svg>
