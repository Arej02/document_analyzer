; design_agent3.md §8. Copied verbatim to the assembled project's root by stage
; `assemble` (§5), so it's the config `python -m pytest` reads when the sandbox
; runs from /work (§7).
[pytest]
markers =
    contract: generated contract test, derived from the plan's test_contract (design_agent3.md §6)
    behaviour: generated behaviour test, from an LLM call (design_agent3.md §6)
; importlib import mode (not the default "prepend"): stage assemble's whole-project
; run (design_agent3.md §5) puts many units' tests/units/{slug}/test_contract.py
; files side by side with no __init__.py packages between them, all sharing the
; same basename — prepend mode can't tell them apart and pytest refuses to
; collect the second one ("import file mismatch"). A per-unit sandbox workspace
; (stage units, §4) only ever has one such file, so this is a no-op there.
addopts = --strict-markers --import-mode=importlib
; Per-test wall clock (pytest-timeout). The sandbox's own outer timeout
; (sandbox_timeout_seconds, enforced by the worker killing the container) is
; separate and always the larger bound.
timeout = 30
