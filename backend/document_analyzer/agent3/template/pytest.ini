; design_agent3.md §8. Copied verbatim to the assembled project's root by stage
; `assemble` (§5), so it's the config `python -m pytest` reads when the sandbox
; runs from /work (§7).
[pytest]
markers =
    contract: generated contract test, derived from the plan's test_contract (design_agent3.md §6)
    behaviour: generated behaviour test, from an LLM call (design_agent3.md §6)
addopts = --strict-markers
; Per-test wall clock (pytest-timeout). The sandbox's own outer timeout
; (sandbox_timeout_seconds, enforced by the worker killing the container) is
; separate and always the larger bound.
timeout = 30
