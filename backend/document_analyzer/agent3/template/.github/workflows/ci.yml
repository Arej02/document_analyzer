# Written by Agent 3 (Execute) — design_agent3.md §15.2. Fixed file, identical in every delivery.
# Runs the generated project's own tests on every pull request so the customer's CI result
# is independent evidence next to Agent 3's sandbox verdicts (which are advisory, §7).
# No secrets, read-only token, no network use beyond installing the pinned requirements.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned by commit SHA (resolved from the release tags below on 2026-10-01).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
